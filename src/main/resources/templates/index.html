<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мой Блог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { padding-top: 60px; background-color: #f8f9fa; }
        .article-card { margin-bottom: 1rem; }
        .comment { font-size: 0.9em; color: #555; margin: 0.5rem 0; }
        .hidden { display: none !important; }
        footer { margin-top: 3rem; text-align: center; color: #6c757d; font-size: 0.9em; }
    </style>
</head>
<body>

<!-- Навбар -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#" onclick="showHome()">Мой Блог</a>
        <div class="ms-auto">
            <span id="auth-links">
                <button class="btn btn-outline-light btn-sm" onclick="showLogin()">Войти</button>
                <button class="btn btn-success btn-sm" onclick="showRegister()">Регистрация</button>
            </span>
            <span id="user-panel" class="hidden">
                Добро пожаловать, <strong id="username"></strong>
                <button class="btn btn-warning btn-sm ms-2" onclick="showCreateArticle()">Новая статья</button>
                <button class="btn btn-danger btn-sm ms-2" onclick="logout()">Выход</button>
            </span>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Главная страница: список статей -->
    <section id="home">
        <h2>Статьи</h2>
        <div class="mb-3">
            <input type="text" id="search-input" class="form-control" placeholder="Поиск..." oninput="searchArticles()"/>
        </div>
        <div id="articles-list">
            <!-- Статьи будут загружены динамически -->
        </div>
    </section>

    <!-- Детали статьи -->
    <section id="article-detail" class="hidden">
        <button class="btn btn-secondary mb-3" onclick="showHome()">← Назад к списку</button>
        <h2 id="article-title"></h2>
        <p><small class="text-muted">Автор: <span id="article-author"></span> | <span id="article-date"></span></small></p>
        <div id="article-content" class="mb-4"></div>

        <!-- Комментарии -->
        <h5>Комментарии</h5>
        <div id="comments-list">
            <!-- Комментарии подгружаются -->
        </div>

        <!-- Форма добавления комментария -->
        <div id="comment-form-container" class="mt-3 hidden">
            <textarea id="comment-text" class="form-control mb-2" rows="2" placeholder="Напишите комментарий..."></textarea>
            <button class="btn btn-primary btn-sm" onclick="addComment()">Добавить</button>
        </div>
    </section>

    <!-- Форма входа -->
    <section id="login-form" class="hidden">
        <h2>Вход</h2>
        <div class="alert alert-danger hidden" id="login-error"></div>
        <input type="text" id="login-username" class="form-control mb-2" placeholder="Логин"/>
        <input type="password" id="login-password" class="form-control mb-2" placeholder="Пароль"/>
        <button class="btn btn-primary" onclick="login()">Войти</button>
        <button class="btn btn-link" onclick="showHome()">Отмена</button>
    </section>

    <!-- Форма регистрации -->
    <section id="register-form" class="hidden">
        <h2>Регистрация</h2>
        <div class="alert alert-danger hidden" id="register-error"></div>
        <input type="text" id="reg-username" class="form-control mb-2" placeholder="Логин"/>
        <input type="password" id="reg-password" class="form-control mb-2" placeholder="Пароль"/>
        <button class="btn btn-success" onclick="register()">Зарегистрироваться</button>
        <button class="btn btn-link" onclick="showHome()">Отмена</button>
    </section>

    <!-- Форма создания статьи -->
    <section id="create-article-form" class="hidden">
        <h2>Новая статья</h2>
        <div class="alert alert-danger hidden" id="create-error"></div>
        <input type="text" id="article-title-input" class="form-control mb-2" placeholder="Заголовок"/>
        <textarea id="article-content-input" class="form-control mb-2" rows="5" placeholder="Текст статьи..."></textarea>
        <button class="btn btn-success" onclick="createArticle()">Опубликовать</button>
        <button class="btn btn-link" onclick="showHome()">Отмена</button>
    </section>

</div>

<footer>
    &copy; 2025 Мой Блог. Все права защищены.
</footer>

<script>
    // Управление экранами
    function showSection(id) {
        document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
    }

    const showHome = () => showSection("home");
    const showLogin = () => showSection("login-form");
    const showRegister = () => showSection("register-form");
    const showCreateArticle = () => showSection("create-article-form");

    // Токен и текущий пользователь
    let authToken = localStorage.getItem("authToken");
    let currentUser = null;

    // Проверка авторизации
    function updateAuthUI() {
        if (authToken) {
            document.getElementById("auth-links").classList.add("hidden");
            document.getElementById("user-panel").classList.remove("hidden");
            document.getElementById("username").textContent = currentUser;
            document.getElementById("comment-form-container").classList.remove("hidden");
        } else {
            document.getElementById("auth-links").classList.remove("hidden");
            document.getElementById("user-panel").classList.add("hidden");
            document.getElementById("comment-form-container").classList.add("hidden");
        }
    }

    // Загрузка статей
    async function loadArticles(keyword = "") {
        try {
            const url = keyword ? `/api/articles/search?keyword=${encodeURIComponent(keyword)}` : "/api/articles";
            const res = await fetch(url);
            const articles = await res.json();
            const container = document.getElementById("articles-list");
            container.innerHTML = "";

            articles.forEach(art => {
                const date = new Date(art.createdAt).toLocaleString("ru-RU");
                const div = document.createElement("div");
                div.className = "card article-card";
                div.innerHTML = `
                    <div class="card-body">
                        <h5 class="card-title">${art.title}</h5>
                        <p class="card-text">${art.content.substring(0, 150)}...</p>
                        <small class="text-muted">Автор: ${art.author.username} | ${date}</small>
                        <br>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="viewArticle(${art.id})">Читать далее</button>
                    </div>
                `;
                container.appendChild(div);
            });
        } catch (e) {
            console.error("Ошибка загрузки статей:", e);
        }
    }

    // Поиск
    function searchArticles() {
        const keyword = document.getElementById("search-input").value;
        loadArticles(keyword);
    }

    // Просмотр статьи
    async function viewArticle(id) {
        try {
            const res = await fetch(`/api/articles/${id}`);
            const art = await res.json();

            document.getElementById("article-title").textContent = art.title;
            document.getElementById("article-content").textContent = art.content;
            document.getElementById("article-author").textContent = art.author.username;
            document.getElementById("article-date").textContent = new Date(art.createdAt).toLocaleString("ru-RU");

            // Загрузка комментариев
            const commentsRes = await fetch(`/api/comments?articleId=${id}`);
            const comments = await commentsRes.json();
            const commentsList = document.getElementById("comments-list");
            commentsList.innerHTML = "";
            comments.forEach(c => {
                const p = document.createElement("p");
                p.className = "comment";
                p.innerHTML = `<strong>${c.author.username}</strong>: ${c.content}`;
                commentsList.appendChild(p);
            });

            showSection("article-detail");
        } catch (e) {
            alert("Ошибка загрузки статьи.");
        }
    }

    // Добавление комментария
    async function addComment() {
        const text = document.getElementById("comment-text").value.trim();
        if (!text) return;

        const articleId = window.location.hash.split("=")[1]; // предполагаем, что ID в хэше
        const res = await fetch("/api/comments", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${authToken}`
            },
            body: JSON.stringify({ content: text, articleId: parseInt(articleId) })
        });

        if (res.ok) {
            document.getElementById("comment-text").value = "";
            // Перезагрузим комментарии
            viewArticle(articleId);
        } else {
            alert("Не удалось добавить комментарий.");
        }
    }

    // Вход
    async function login() {
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;

        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (res.ok) {
            const data = await res.json();
            authToken = data.token;
            currentUser = data.username;
            localStorage.setItem("authToken", authToken);
            updateAuthUI();
            showHome();
            loadArticles();
        } else {
            document.getElementById("login-error").textContent = "Неверный логин или пароль";
            document.getElementById("login-error").classList.remove("hidden");
        }
    }

    // Регистрация
    async function register() {
        const username = document.getElementById("reg-username").value;
        const password = document.getElementById("reg-password").value;

        const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (res.ok) {
            alert("Регистрация успешна! Теперь войдите.");
            showLogin();
        } else {
            document.getElementById("register-error").textContent = "Ошибка регистрации";
            document.getElementById("register-error").classList.remove("hidden");
        }
    }

    // Выход
    function logout() {
        authToken = null;
        currentUser = null;
        localStorage.removeItem("authToken");
        updateAuthUI();
        showHome();
    }

    // Создание статьи
    async function createArticle() {
        const title = document.getElementById("article-title-input").value;
        const content = document.getElementById("article-content-input").value;

        const res = await fetch("/api/articles", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${authToken}`
            },
            body: JSON.stringify({ title, content })
        });

        if (res.ok) {
            showHome();
            loadArticles();
        } else {
            document.getElementById("create-error").textContent = "Ошибка публикации";
            document.getElementById("create-error").classList.remove("hidden");
        }
    }

    // Инициализация
    updateAuthUI();
    loadArticles();
</script>

</body>
</html>
